---
- name: Collect bounded Linux facts for the reviewed remote pilot
  hosts: kaori_remote_pilot
  gather_facts: false
  become: false
  strategy: linear
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Inspect selected Linux host facts without infrastructure mutation
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution
          - kernel
          - hardware
          - network
          - date_time
          - user
          - pkg_mgr
          - python
        filter:
          - ansible_distribution
          - ansible_distribution_version
          - ansible_distribution_major_version
          - ansible_os_family
          - ansible_kernel
          - ansible_architecture
          - ansible_pkg_mgr
          - ansible_processor_vcpus
          - ansible_memtotal_mb
          - ansible_mounts
          - ansible_default_ipv4
          - ansible_all_ipv4_addresses
          - ansible_interfaces
          - ansible_date_time
          - ansible_effective_user_id
          - ansible_python_version
