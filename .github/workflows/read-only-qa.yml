name: Read-only Automation Source QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'kaori/**'

permissions:
  contents: read

jobs:
  safe-source:
    name: Source guard and local Ansible syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Ansible dependencies
        run: python -m pip install --disable-pip-version-check -r execution-environments/requirements.txt
      - name: Read-only negative/positive unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned source and test target
        run: |
          python -m automation.preflight \
            --revision "$GITHUB_SHA" \
            --inventory ansible/inventory/examples/localhost.ini \
            --limit localhost
      - name: Validate read-only playbook syntax
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-playbook -i ansible/inventory/examples/localhost.ini --syntax-check ansible/playbooks/linux_host_facts.yml
      - name: Run localhost-only fact collection
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-playbook -i ansible/inventory/examples/localhost.ini --limit localhost ansible/playbooks/linux_host_facts.yml

      - name: Runner schema smoke (localhost only)
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          python - <<'PY'
          import json
          from tempfile import TemporaryDirectory
          from pathlib import Path
          import ansible_runner

          root = Path.cwd()
          with TemporaryDirectory(prefix="kaori-runner-ci-") as workspace:
              runner = ansible_runner.run(
                  private_data_dir=workspace,
                  project_dir=str(root / "ansible/playbooks"),
                  playbook="linux_host_facts.yml",
                  inventory=str(root / "ansible/inventory/examples/localhost.ini"),
                  limit="localhost",
                  timeout=120,
                  quiet=True,
                  suppress_env_files=True,
                  envvars={"ANSIBLE_CONFIG": str(root / "ansible/ansible.cfg")},
              )
              if runner.status != "successful" or runner.rc != 0:
                  raise SystemExit("Runner smoke failed")
              events = list(runner.events)
              stats = runner.stats or {}
              changed = stats.get("changed")
              ok = stats.get("ok")
              if not isinstance(changed, dict) or not isinstance(ok, dict):
                  raise SystemExit("Required Runner stats missing")
              if changed.get("localhost", 0) != 0 or ok.get("localhost", 0) < 1:
                  raise SystemExit("Runner host read-only postcondition failed")
              found = False
              for event in events:
                  event_data = event.get("event_data") or {}
                  facts = (event_data.get("res") or {}).get("ansible_facts") or {}
                  if event.get("event") == "runner_on_ok" and "ansible_distribution" in facts and "ansible_kernel" in facts:
                      found = True
              if not found:
                  raise SystemExit("Required source-backed OS/kernel facts were not emitted")
              # Print only bounded test evidence, no raw native events or host facts.
              print(json.dumps({"status":"PASS", "runner_status": runner.status,
                                "changed": changed.get("localhost", 0),
                                "ok": ok.get("localhost", 0), "fact_event": found}))
          PY
